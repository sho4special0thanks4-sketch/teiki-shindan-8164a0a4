<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>定期診断ご報告書</title>
<style>
:root{--line:#111;--navy:#06118a;--gray:#9a9a9a;--slate:#66669a}
*{box-sizing:border-box}
html{background:#d9dde6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;color:#111;font-size:13px;line-height:1.5}
[hidden]{display:none !important}

/* ---- ツールバー（画面のみ） ---- */
.toolbar{position:sticky;top:0;z-index:20;background:#12206b;color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar b{margin-right:8px}
.toolbar button{font:inherit;font-size:13px;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;background:#2a45c2;color:#fff}
.toolbar button.sub{background:#4a5a9a}
.toolbar .note{font-size:12px;opacity:.85;margin-left:auto}
#saveState,#pageInfo{font-size:12px;opacity:.9}

/* ---- A4用紙 ---- */
#root{transform-origin:top center}
.sheet{position:relative;width:210mm;height:297mm;margin:14px auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.sheet.cover{padding:5.4mm 12mm 8mm 12.5mm}
.sheet.pg{padding:5mm 22mm 14mm}
.pbody{flex:1;min-height:0;position:relative;overflow:hidden}
.pno{position:absolute;left:0;right:0;bottom:6mm;text-align:center;font-size:12px;font-weight:700}
.pbody>.blk:first-child{margin-top:0}
.blk{margin-top:3mm}

[contenteditable]{outline:none;white-space:pre-wrap;word-break:break-all}
[contenteditable]:hover{background:#fffbe0}
[contenteditable]:focus{background:#fff6b8}
@media screen{[contenteditable]:empty::before{content:attr(data-ph);color:#b0b0b0}}

/* ---- 上部の型式表 ---- */
table.code{width:100%;border-collapse:collapse;font-size:10.5px;table-layout:fixed}
table.code td{border:2px solid var(--line);padding:1px 4px;height:4.6mm;text-align:center;white-space:nowrap}
table.code td.l{text-align:left}
.pg-head .logo{height:9mm;width:40mm;margin:4mm 0 1.5mm}

/* ---- 表紙 ---- */
.ctitle{font-size:22px;font-weight:700;text-align:center;margin:3.6mm 0 3mm;letter-spacing:.04em}
.ctitle span{display:inline-block;min-width:3em}
.cmain{display:flex;gap:4.5mm;margin-top:3.2mm;align-items:flex-start}
.cmain .photo{flex:0 0 63%;aspect-ratio:1.34}
table.dates{flex:1;border-collapse:collapse;font-size:13px}
table.dates td{border:2px solid var(--line);height:8mm;padding:0 6px;text-align:center;white-space:nowrap}
table.dates td.k{background:#8f8f8f;color:#111;letter-spacing:.5em;width:50%;font-weight:700}
.gtitle{background:var(--gray);text-align:center;font-weight:800;font-size:21px;letter-spacing:.6em;padding:.6mm 0 .6mm .6em;margin-top:3mm}
.sg{display:grid;grid-template-columns:9.5mm 6.2mm 34mm 1fr;border:2px solid var(--line);margin-top:1.5mm;font-size:13px}
.sg>div{border-bottom:1px solid var(--line);padding:0 5px;display:flex;align-items:center;min-height:5.8mm}
.sg .g1{grid-column:1;grid-row:1/15;background:var(--gray);border-right:2px solid var(--line);border-bottom:0;justify-content:center;padding:0}
.sg .g2{grid-column:2;background:#fff;border-right:1px solid var(--line);justify-content:center;padding:0;font-weight:700}
.sg .lab{grid-column:3;justify-content:center;font-weight:800;font-size:14px;border-right:1px solid var(--line)}
.sg .val{grid-column:4}
.sg .cut{border-bottom:2px solid var(--line)}
.sg .last{border-bottom:0}
.sg .g2.cut{border-bottom:2px solid var(--line)}
.sg .g2.last{border-bottom:0}
.vt{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:13.5px;line-height:1.28}
.vt.s{font-size:12.5px}
.other{display:grid;grid-template-columns:9.5mm 1fr;border:2px solid var(--line);border-top:0;height:35mm;min-height:12mm;flex:0 1 auto;font-size:13.5px}
.other .g1{background:var(--gray);border-right:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.other .body{display:flex;align-items:center;padding:2px 3px;line-height:1.45}
.other .body>div{width:100%}
.cfoot{text-align:center;font-size:12.5px;margin-top:4mm;line-height:1.4}
.cfoot span.nm{display:inline-block;min-width:11em;text-align:center}
.cfoot2{display:flex;align-items:center;gap:2mm;margin-top:3mm;line-height:1.25}
.cfoot2 .t{white-space:nowrap}
.cfoot2 .t b{display:block;font-weight:500;font-size:12.5px}
.cfoot2 .t i{font-style:normal;font-size:10.5px}
.cfoot2 .qr{width:13mm;height:13mm;flex:none}
.cfoot2 .logo{width:40mm;height:10mm;flex:none;margin-left:auto}

/* ---- 写真 ---- */
.photo{position:relative;background:#f1f3f9;border:1px solid #8a93b5;overflow:hidden;display:block}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:#5b6690;cursor:pointer;padding:6px}
.photo .cam{display:none;position:absolute;left:6px;bottom:6px;z-index:3;border:0;border-radius:8px;background:#2a45c2;color:#fff;font:inherit;font-size:15px;min-height:40px;padding:6px 14px;cursor:pointer}
@media screen and (pointer:coarse){.photo .cam{display:block}.photo .ph{padding-bottom:58px}}
.photo input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo.has .ph{display:none}
.photo .rm{position:absolute;right:4px;top:4px;z-index:2;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;display:none;line-height:22px;padding:0}
.photo.has .rm{display:block}
.photo.has{cursor:pointer}
.photo.drag{outline:3px dashed #2a45c2}

/* ---- 2ページ目以降 ---- */
.zenkei{display:flex;gap:4mm}
.zl{flex:0 0 55%}
.zl .photo{aspect-ratio:1.34}
.zr{flex:1;display:flex;flex-direction:column;min-width:0}
.gband{background:var(--slate);color:#fff;text-align:center;font-weight:700;font-size:15px;border:3px solid #c3c3c3;padding:.4mm 0;margin-bottom:0;line-height:1.5}
.zl .gband{margin-bottom:0}
.env{display:grid;grid-template-columns:36% 1fr;border:2px solid var(--line);font-size:11.5px}
.env>div{border-top:2px solid var(--line);padding:1px 4px;min-height:8.8mm;display:flex;align-items:center}
.env .t{grid-column:1/3;border-top:0;justify-content:center;min-height:10.6mm;font-size:13px}
.env .k{justify-content:center;border-right:2px solid var(--line);font-size:12.5px}
.zr .gband.s{width:58%;margin-top:2.4mm}
.zr .photo{width:58%;aspect-ratio:1.48}
.band{position:relative;background:var(--navy);color:#fff;text-align:center;font-weight:700;font-size:14.5px;padding:2.2mm 0;line-height:1.4}
.band>div[contenteditable]{min-height:1.4em;padding:0 22%}
.band>div[contenteditable]:hover,.band>div[contenteditable]:focus{color:#fff;background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85);caret-color:#fff}
.band>div[contenteditable]::selection{background:#fff;color:#06118a}
.band .sec-tools{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;gap:4px}
.entry{display:flex;gap:4mm;position:relative}
.entry .photo{flex:0 0 55%;aspect-ratio:1.34;align-self:flex-start}
.dg{flex:1;position:relative;min-width:0}
.dg>.in{position:absolute;inset:0;display:grid;grid-template-columns:28% 1fr;grid-template-rows:minmax(0,13fr) minmax(0,36fr) minmax(0,51fr);border:2px solid var(--line);font-size:12px}
.dg .in>div{padding:1px 4px;overflow:hidden;border-bottom:2px solid var(--line)}
.dg .in>div:nth-child(n+5){border-bottom:0}
.dg .k{display:flex;align-items:center;justify-content:center;text-align:center;border-right:2px solid var(--line);font-size:12.5px}
.dg .v{padding-top:0;line-height:1.38;letter-spacing:.04em}
.dg .v.c{display:flex;align-items:center;justify-content:center;text-align:center}
.entry .sec-tools{position:absolute;left:4px;top:4px;z-index:3}
.mini{font:inherit;font-size:12px;border:1px solid #9aa4bb;background:#fff;color:#223;border-radius:5px;padding:2px 8px;cursor:pointer}
.mini.del{border-color:#d49a9a;color:#a33}

/* 総合所見の行が増えて表紙に入りきらないときの詰め表示 */
.cover.tight .sg{font-size:12.5px}.cover.tight .sg>div{min-height:4.9mm;line-height:1.3}.cover.tight .sg .lab{font-size:13px}
.cover.tighter .sg{font-size:12px}.cover.tighter .sg>div{min-height:4.4mm;line-height:1.2}.cover.tighter .sg .lab{font-size:12.5px}
/* ---- 行の追加・削除（画面のみ） ---- */
#rowTools{position:fixed;z-index:30;display:none;gap:4px}
#rowTools button{border:1px solid #2a45c2;background:#fff;color:#2a45c2;border-radius:6px;font:inherit;font-size:12px;line-height:1;padding:5px 8px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#rowTools button.d{border-color:#c77;color:#a33}
@media screen and (pointer:coarse){#rowTools button{font-size:15px;padding:9px 12px}}
@media print{#rowTools{display:none !important}}
.cap #rowTools{display:none !important}

/* ---- 定型文プルダウン（画面のみ） ---- */
#tmplBtn{position:fixed;z-index:30;display:none;border:1px solid #2a45c2;background:#fff;color:#2a45c2;border-radius:6px;font:inherit;font-size:12px;line-height:1;padding:5px 8px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#tmplMenu{position:fixed;z-index:31;display:none;background:#fff;border:1px solid #2a45c2;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.35);max-height:70vh;overflow:auto;width:min(92vw,440px)}
#tmplMenu .ttl{padding:6px 12px;font-size:12px;background:#eef1fb;color:#2a45c2;font-weight:700}
#tmplMenu button{display:block;width:100%;text-align:left;border:0;border-top:1px solid #e1e5f3;background:#fff;font:inherit;font-size:14px;line-height:1.45;padding:10px 12px;cursor:pointer}
#tmplMenu button:hover{background:#fff6b8}
#tmplMenu button.clr{color:#a33}
@media screen and (pointer:coarse){#tmplBtn{font-size:15px;padding:9px 12px}#tmplMenu button{font-size:16px;padding:13px 14px}}
@media print{#tmplBtn,#tmplMenu{display:none !important}}
.cap #tmplBtn,.cap #tmplMenu{display:none !important}

/* ---- お客様情報パネル・ひな形メニュー（画面のみ） ---- */
#infobar{max-width:794px;margin:10px auto 0;background:#fff;border:2px solid #2a45c2;border-radius:10px;padding:8px 12px}
#infobar summary{cursor:pointer;font-weight:700;color:#2a45c2;font-size:14px;padding:4px 0}
#infobar .ibgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 12px;margin-top:6px}
#infobar label{display:flex;flex-direction:column;font-size:12px;color:#445;gap:2px}
#infobar input{font:inherit;font-size:16px;padding:7px 8px;border:1px solid #9aa4bb;border-radius:6px;background:#fffbe0;min-height:40px;color:#111}
#ibHint{font-size:13px;color:#2a45c2;margin-top:6px}
#ibHint:empty{display:none}
.ibnote{background:#eef1fb;border-radius:6px;padding:6px 10px;margin:4px 0 6px;font-size:13px;color:#223;line-height:1.7}
.ibnote button{font:inherit;font-size:13px;margin-left:8px;border:1px solid #2a45c2;background:#fff;color:#2a45c2;border-radius:6px;padding:4px 10px;cursor:pointer}
#secMenu{position:fixed;z-index:35;display:none;background:#fff;border:1px solid #2a45c2;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.35);max-height:70vh;overflow:auto;width:min(92vw,340px)}
#secMenu .ttl{padding:6px 12px;font-size:12px;background:#eef1fb;color:#2a45c2;font-weight:700}
#secMenu button{display:block;width:100%;text-align:left;border:0;border-top:1px solid #e1e5f3;background:#fff;font:inherit;font-size:15px;padding:12px 14px;cursor:pointer}
#secMenu button:hover{background:#fff6b8}
@media screen and (pointer:coarse){.toolbar button{min-height:46px}.mini{min-height:40px}.photo .cam{min-height:46px}#secMenu button{font-size:17px;padding:15px 14px}}
@media print{#infobar,#secMenu{display:none !important}}
.cap #infobar,.cap #secMenu{display:none !important}

/* ---- 日付のカレンダーボタン（画面のみ） ---- */
#dateBtn{position:fixed;z-index:30;display:none;overflow:hidden;border:1px solid #2a45c2;background:#fff;color:#2a45c2;border-radius:6px;font:inherit;font-size:12px;line-height:1;padding:5px 8px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#dateBtn input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0}
@media screen and (pointer:coarse){#dateBtn{font-size:15px;padding:9px 12px}}
@media print{#dateBtn{display:none !important}}
.cap #dateBtn{display:none !important}

/* ---- iPad・タブレット対応 ---- */
@media screen and (pointer:coarse){
  .toolbar button{min-height:42px;font-size:15px;padding:8px 14px}
  .mini{min-height:34px;font-size:14px;padding:4px 12px}
  .photo .rm{width:34px;height:34px;line-height:34px;font-size:18px}
  [contenteditable]:hover{background:none}
  .toolbar .note{display:none}
}
.photo,.photo .ph{-webkit-touch-callout:none}

/* PDF作成時の見た目（編集用の部品を隠す） */
.cap .no-print,.cap .sec-tools,.cap .photo .rm,.cap .photo .ph,.cap .photo .cam{display:none !important}
.cap .sheet{margin:0 !important;box-shadow:none !important}
.cap [contenteditable]:hover,.cap [contenteditable]:focus{background:none !important}
.cap [contenteditable]:empty::before{content:none !important}
.cap .band>div[contenteditable]{color:#fff !important;box-shadow:none !important}
.cap .photo{border-color:#666}
.cap .photo:not(.has){background:#fff}
#pdfBusy{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}

/* ---- 印刷：画面と同じA4を1枚ずつ ---- */
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  .toolbar,.no-print,.sec-tools,.photo .rm{display:none !important}
  #root{zoom:1 !important}
  html.ios #root{zoom:.82 !important}
  html.ios .sheet{margin:0 auto}
  .sheet{margin:0;box-shadow:none;height:296.5mm;break-after:page;break-inside:avoid}
  .sheet:last-child{break-after:auto}
  [contenteditable]:hover,[contenteditable]:focus{background:none}
  .band>div[contenteditable]{color:#fff !important;box-shadow:none !important}
  .photo{border-color:#666}
  .photo .ph{display:none}
  .photo:not(.has){background:#fff}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#histOv{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
#histOv[hidden]{display:none}
#histOv .hbox{background:#fff;border-radius:10px;max-width:640px;width:100%;padding:14px 16px;color:#222;font-size:15px}
#histOv .hhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#histOv .hnote{background:#eef1fb;border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.7;margin-bottom:8px}
#histOv .hrow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;border-top:1px solid #ddd;padding:9px 0}
#histOv .ht{font-weight:bold;min-width:84px}
#histOv .hn{flex:1;min-width:120px}
#histOv .hp{color:#555;font-size:13px}
#histOv .hempty{padding:18px 4px;color:#555}
#histOv .hact{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px;font-size:13px;color:#334}
#histOv button.hdel{background:#b33;min-height:36px;padding:6px 10px;font-size:13px}

<body>

<div class="toolbar no-print">

  <span class="note">黄色くなる所はクリックして直接入力／写真は📷で撮影／A4で1枚ずつ自動で区切ります</span>
</div>

<noscript><div style="max-width:560px;margin:30px auto;padding:20px;background:#fff3b0;border:3px solid #2a45c2;border-radius:10px;font-size:16px;line-height:1.7">
<b>この画面ではプログラムが止められているため、動きません。</b><br>
iPadの「ファイル」アプリのプレビューなどでは動きません。Safariで開いてください。</div></noscript>

<div id="root">
  <section class="sheet cover" id="cover"></section>
  <div id="doc"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  if(/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)){document.documentElement.classList.add("ios")}
  var KEY="teikiShindan25.v1";
  var root=document.getElementById("root");
  var cover=document.getElementById("cover");
  var doc=document.getElementById("doc");
  var DEF_RESULT="異常ありません。";
  var DEF_NOTE="得られた結果は弊社基準内です。現状では特に対応の必要はございません。次回の定期診断時にも再度確認いたします。";
  var uid=0;function newSid(){return "s"+Date.now().toString(36)+(uid++)}
  function today(){var d=new Date();return d.getFullYear()+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+("0"+d.getDate()).slice(-2)}

  /* ---------- 写真枠 ---------- */
  function photoHTML(cap){
    return '<div class="photo" data-cap="'+cap+'"><img alt="" hidden><span class="ph"></span><button class="rm" type="button" title="写真をはずす">×</button><input type="file" accept="image/*"><input class="camin" type="file" accept="image/*" capture="environment"><button class="cam no-print" type="button">📷 撮影</button></div>';
  }
  function vt(s,cls){return '<div class="vt'+(cls?" "+cls:"")+'">'+s.split("").map(function(c){return "<span>"+c+"</span>"}).join("")+'</div>'}

  /* ---------- 表紙 ---------- */
  var ROWS=[
    ["基礎","異常ありません。ご安心下さい。"],["構造体","異常ありません。ご安心下さい。"],["防蟻","異常ありません。ご安心下さい。"],
    ["屋根","異常ありません。5年後がメンテナンスの時期です。"],["外壁","異常ありません。5年後がメンテナンスの時期です。"],
    ["バルコニー","異常ありません。5年後がメンテナンスの時期です。"],["コーキング","異常ありません。5年後がメンテナンスの時期です。"],
    ["給排水管","異常ありませんがメンテナンス時期を迎えています。この機会にご検討ください。"],["その他","異常ありません。5年後がメンテナンスの時期です。"],
    ["サニタリー","異常ありません。ご安心下さい。"],["キッチン","メンテナンスの時期は迎えております。この機会にご検討ください。"],
    ["トイレ","異常ありません。ご安心下さい。"],["給湯器","異常ありません。ご安心下さい。"],["その他","異常ありません。ご安心下さい。"]
  ];
  function coverHTML(){
    var rows="";
    ROWS.forEach(function(r,i){
      var cut=(i===8)?" cut":(i===13?" last":"");
      rows+='<div class="lab'+cut+'" data-g="'+(i<9?"b":"s")+'" style="grid-row:'+(i+1)+'" contenteditable>'+r[0]+'</div><div class="val'+cut+'" style="grid-row:'+(i+1)+'" contenteditable>'+r[1]+'</div>';
    });
    return '<table class="code"><tr><td class="l" style="width:17%" contenteditable data-f="0" data-ph="邸コード：">邸コード：</td><td style="width:41%" contenteditable data-f="1"></td><td style="width:9%" contenteditable data-f="2"></td><td style="width:10%" contenteditable data-f="3">25年診断</td><td style="width:23%" contenteditable data-f="4"></td></tr>'+
      '<tr><td class="l" colspan="5" contenteditable data-f="5" data-ph="外壁・屋根の仕様"></td></tr></table>'+
      '<div class="ctitle"><span contenteditable data-ph="お客様名" data-f="n"></span>　様邸　<span data-f="t" style="min-width:0">25年目定期診断ご報告書</span></div>'+
      '<div class="gbar"></div>'+
      '<div class="cmain">'+photoHTML("外観写真をタップして追加")+
        '<table class="dates"><tr><td class="k">診　断　日</td><td contenteditable data-ph="">'+today()+'</td></tr><tr><td class="k">お引渡し日</td><td contenteditable data-ph=""></td></tr></table></div>'+
      '<div class="gbar" style="margin-top:3mm"></div>'+
      '<div class="gtitle">総合所見</div>'+
      '<div class="sg"><div class="g1">'+vt("メンテナンス")+'</div>'+
        '<div class="g2 cut" style="grid-row:1/10">'+vt("建物","s")+'</div><div class="g2 last" style="grid-row:10/15">'+vt("設備","s")+'</div>'+rows+'</div>'+
      '<div class="other"><div class="g1">'+vt("その他")+'</div><div class="body"><div contenteditable>いつもご愛顧いただき誠にありがとうございます。お困り事(故障・水漏れ含)はなんでもご相談ください。なお、定期診断での確認は目視中心のため、確認しきれない箇所もございます。ご了承ください。</div></div></div>'+
      '<div class="cfoot">ひだまり工務店(サンプル) <span contenteditable>本店</span> (診断担当　<span class="nm" contenteditable data-ph="担当者名"></span>)</div>'+
      '';
  }

  /* ---------- 2ページ目以降のブロック ---------- */
  function zenkeiBlock(){
    return '<div class="blk zenkei" data-sid="zenkei"><div class="zl"><div class="gband">全景</div>'+photoHTML("全景写真を追加")+'</div>'+
      '<div class="zr"><div class="env"><div class="t" contenteditable>周辺環境</div>'+
      '<div class="k" contenteditable>日当り</div><div contenteditable data-ph=""></div>'+
      '<div class="k" contenteditable>川、沼、海</div><div contenteditable data-ph=""></div>'+
      '<div class="k" contenteditable>道路、鉄道</div><div contenteditable data-ph=""></div></div>'+
      '<div class="gband s">表札</div>'+photoHTML("表札写真を追加")+'</div></div>';
  }
  function bandBlock(sid,title){
    return '<div class="blk band" data-sid="'+sid+'" data-keep="1"><div contenteditable data-ph="見出し（例：外壁）">'+title+'</div>'+
      '<span class="sec-tools no-print"><button class="mini" type="button" data-act="addEntry">＋診断欄</button><button class="mini del" type="button" data-act="delSec">見出し削除</button></span></div>';
  }
  function entryBlock(sid,item,res,note){
    return '<div class="blk entry" data-sid="'+sid+'">'+photoHTML("写真をタップして追加")+
      '<div class="dg"><div class="in"><div class="k" contenteditable>診断項目</div><div class="v c" contenteditable data-ph="診断項目">'+(item||"")+'</div>'+
      '<div class="k" contenteditable>診断結果</div><div class="v" contenteditable data-ph="診断結果">'+(res==null?DEF_RESULT:res)+'</div>'+
      '<div class="k" contenteditable>所見</div><div class="v" contenteditable data-ph="所見">'+(note==null?DEF_NOTE:note)+'</div></div></div>'+
      '<span class="sec-tools no-print"><button class="mini del" type="button" data-act="delEntry">この診断を削除</button></span></div>';
  }
  function sectionHTML(title,entries){
    var sid=newSid();
    return bandBlock(sid,title)+entries.map(function(e){return entryBlock(sid,e[0],e[1],e[2])}).join("");
  }
  function defaultBlocks(){
    return zenkeiBlock()+
      sectionHTML("基礎　水平測定(外壁出隅 対角4箇所)",[["傾斜　※水平ゲージ気泡が全箇所で枠線内→否(判定)"],["傾斜　※水平ゲージ気泡が全箇所で枠線内→否(判定)"]])+
      sectionHTML("基礎　立上り部",[["欠損　※深さ20mm以上の場合は要(判定)"],["ひび割れ　※幅0.5mm以上の場合は要(判定)"]])+
      sectionHTML("外壁",[["クラック",DEF_RESULT,"特に必要ありません。"]])+
      sectionHTML("屋根",[[""]])+
      sectionHTML("バルコニー",[[""]])+
      sectionHTML("コーキング",[[""]])+
      sectionHTML("給排水管・水まわり設備",[[""]]);
  }

  /* ---------- A4ページ割り（2ページ目以降） ---------- */
  /* 表題の「◯年目定期診断ご報告書」は固定。年数は型式欄の「◯年診断」に連動する */
  function syncTitle(){
    var ty=cover.querySelector('[data-f="t"]'),yc=cover.querySelector('[data-f="3"]');
    if(!ty)return;
    var m=yc&&yc.textContent.match(/\d+/);
    ty.removeAttribute("contenteditable");
    ty.textContent=(m?m[0]:"25")+"年目定期診断ご報告書";
  }
  /* 総合所見の行を並べ直す（行の追加・削除のあと） */
  function relayoutSG(){
    var sg=cover.querySelector(".sg");if(!sg)return;
    var labs=[].slice.call(sg.querySelectorAll(".lab"));
    labs.forEach(function(l,i){if(!l.getAttribute("data-g"))l.setAttribute("data-g",i<9?"b":"s")});
    var nb=labs.filter(function(l){return l.getAttribute("data-g")==="b"}).length,N=labs.length;
    labs.forEach(function(l,i){
      var v=l.nextElementSibling;
      [l,v].forEach(function(c){c.style.gridRow=String(i+1);c.classList.remove("cut","last");if(i===nb-1)c.classList.add("cut");if(i===N-1)c.classList.add("last")});
    });
    var g2=sg.querySelectorAll(".g2"),g1=sg.querySelector(".g1");
    if(g2[0])g2[0].style.gridRow="1/"+(nb+1);
    if(g2[1])g2[1].style.gridRow=(nb+1)+"/"+(N+1);
    if(g1)g1.style.gridRow="1/"+(N+1);
  }
  /* 表紙が1枚に入りきらないときは、行間を詰める */
  function fitCover(){
    cover.classList.remove("tight","tighter");
    var over=function(){return cover.scrollHeight>cover.clientHeight+1};
    if(over()){cover.classList.add("tight");if(over()){cover.classList.add("tighter")}}
    var warn=document.getElementById("coverWarn");
    if(over()){
      if(!warn){warn=document.createElement("span");warn.id="coverWarn";warn.style.cssText="color:#ffd54a;font-size:12px;margin-left:6px";document.getElementById("saveState").after(warn)}
      warn.textContent="表紙に入りきりません。総合所見の行を減らしてください";
    }else if(warn){warn.remove()}
  }
  function hf(n){var e=cover.querySelector('[data-f="'+n+'"]');return e?e.textContent:""}
  function newPage(){
    var s=document.createElement("section");s.className="sheet pg";
    s.innerHTML='<div class="pg-head"><table class="code"><tr><td style="width:41%">'+esc(hf(1))+'</td><td style="width:12%">'+esc(hf(2))+'</td><td style="width:14%">'+esc(hf(3))+'</td><td style="width:23%">'+esc(hf(4))+'</td></tr><tr><td class="l" colspan="4">'+esc(hf(5))+'</td></tr></table><div class="gbar"></div></div><div class="pbody"></div><div class="pno"></div>';
    doc.appendChild(s);return s.querySelector(".pbody");
  }
  function esc(t){return String(t).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
  function caretInfo(){
    var a=document.activeElement;
    if(!a||!a.isContentEditable||!doc.contains(a))return null;
    var all=[].slice.call(doc.querySelectorAll("[contenteditable]"));
    var off=0,sel=getSelection();
    if(sel.rangeCount){var r=sel.getRangeAt(0).cloneRange();r.selectNodeContents(a);r.setEnd(sel.getRangeAt(0).endContainer,sel.getRangeAt(0).endOffset);off=r.toString().length}
    return {idx:all.indexOf(a),off:off};
  }
  function restoreCaret(c){
    if(!c||c.idx<0)return;
    var el=doc.querySelectorAll("[contenteditable]")[c.idx];if(!el)return;
    el.focus();
    var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),n,left=c.off,r=document.createRange();
    while((n=w.nextNode())){if(n.length>=left){r.setStart(n,left);r.collapse(true);var s=getSelection();s.removeAllRanges();s.addRange(r);return}left-=n.length}
  }
  function paginate(){
    var c=caretInfo(),sy=window.pageYOffset,sx=window.pageXOffset;  /* 組み直す間にページが空になり、表示位置が上へ飛ぶのを防ぐ */
    var blocks=[].slice.call(doc.querySelectorAll(".blk"));
    var keep=document.createDocumentFragment();
    blocks.forEach(function(b){keep.appendChild(b)});
    doc.innerHTML="";
    var body=newPage();
    blocks.forEach(function(b){
      body.appendChild(b);
      if(body.scrollHeight>body.clientHeight+1&&body.children.length>1){
        body.removeChild(b);
        var carry=[b],prev=body.lastElementChild;
        if(prev&&prev.getAttribute("data-keep")&&body.children.length>1){body.removeChild(prev);carry.unshift(prev)}
        body=newPage();
        carry.forEach(function(x){body.appendChild(x)});
      }
    });
    var sheets=doc.querySelectorAll(".sheet");
    sheets.forEach(function(s,i){s.querySelector(".pno").textContent="- "+(i+1)+" -"});
    document.getElementById("pageInfo").textContent="A4 "+(sheets.length+1)+"枚　";
    setCaps();
    restoreCaret(c);
    window.scrollTo(sx,sy);
  }
  function needRepaginate(){
    var bodies=doc.querySelectorAll(".pbody");
    for(var i=0;i<bodies.length;i++){
      var b=bodies[i];
      if(b.scrollHeight>b.clientHeight+1&&b.children.length>1)return true;
      var nx=bodies[i+1];
      if(nx&&nx.firstElementChild&&b.lastElementChild){
        var used=b.lastElementChild.offsetTop+b.lastElementChild.offsetHeight;
        var need=nx.firstElementChild.offsetHeight+(nx.firstElementChild.getAttribute("data-keep")&&nx.children[1]?nx.children[1].offsetHeight:0)+16;
        if(used+need<b.clientHeight)return true;
      }
    }
    /* 表紙の型式欄が書き換わったら、各ページの上部も更新する */
    var heads=doc.querySelectorAll(".pg-head .code td");
    if(heads.length&&(heads[0].textContent!==hf(1)||heads[1].textContent!==hf(2)||heads[2].textContent!==hf(3)||heads[3].textContent!==hf(4)||heads[4].textContent!==hf(5)))return true;
    return false;
  }

  /* ---------- 保存・復元 ---------- */
  var baked=document.documentElement.getAttribute("data-baked")==="1";
  var restored=false;
  if(baked){restored=!!cover.firstChild}
  else{try{var sv=localStorage.getItem(KEY);if(sv){var o=JSON.parse(sv);cover.innerHTML=o.c;doc.innerHTML=o.d;restored=!!cover.firstChild&&!!doc.querySelector(".blk")}}catch(e){restored=false}}
  if(!restored){cover.innerHTML=coverHTML();doc.innerHTML=defaultBlocks()}

  var st=document.getElementById("saveState"),timer=null;
  function save(){
    var snap=ibSnap(),now=new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
    try{localStorage.setItem(KEY,snap);localStorage.setItem(KEY+".t",String(Date.now()));localStorage.removeItem(KEY+".idb");st.textContent="自動保存しました "+now}
    catch(e){
      try{localStorage.removeItem(KEY)}catch(e2){}
      idbPut(KEY,snap,function(ok){
        if(ok){try{localStorage.setItem(KEY+".idb","1");localStorage.setItem(KEY+".t",String(Date.now()))}catch(e3){}st.textContent="自動保存しました（大容量保存） "+now}
        else st.textContent="自動保存できません（写真が多すぎます）。「このHTMLを保存」で保存してください";
      });
    }
  }
  function later(){clearTimeout(timer);timer=setTimeout(function(){if(needRepaginate())paginate();save()},700)}
  function setCaps(){document.querySelectorAll(".photo").forEach(function(p){
    var fi=p.querySelector("input:not(.camin)");if(fi)fi.multiple=true;
    p.querySelector(".ph").textContent="📷 "+(p.getAttribute("data-cap")||"写真を追加");
    var im=p.querySelector("img");var has=!!(im&&im.getAttribute("src"));
    p.classList.toggle("has",has);if(has)im.hidden=false;
  })}
  /* 画面幅に合わせてA4を縮小（iPad等）。印刷は常に等倍 */
  function fit(){
    var w=Math.max(320,document.documentElement.clientWidth-16),a4=794;
    var z=Math.min(1,w/a4);
    root.style.zoom=z<1?z:"";
  }
  relayoutSG();syncTitle();
  fit();window.addEventListener("resize",fit);window.addEventListener("orientationchange",fit);
  paginate();fitCover();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){paginate();fitCover()});

  /* ---------- 写真 ---------- */
  function loadPhoto(label,file){
    if(!file||!/^image\//.test(file.type))return;
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var max=1300,r=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        var t=label.querySelector("img");t.src=c.toDataURL("image/jpeg",0.8);t.hidden=false;t.removeAttribute("data-lib");
        label.classList.add("has");save();
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(file);
  }
  root.addEventListener("change",function(e){
    var t=e.target;
    if(t.matches('.photo input[type=file]')){handlePhotoFiles(t);t.value=""}
  });
  function lastOfSid(sid){var l=null;doc.querySelectorAll(".blk").forEach(function(b){if(b.getAttribute("data-sid")===sid)l=b});return l}
  root.addEventListener("click",function(e){

      (function next(){
        if(i>=files.length){
          importing=false;prog.textContent="取り込み完了：新しく"+added+"枚"+(dup?"（同じ写真"+dup+"枚は取り込まず）":"")+(bad?"・保存できなかった"+bad+"枚":"");
          persist();render();badge();return;
        }
        var f=files[i++];prog.textContent="取り込み中… "+i+" / "+files.length;
        var key=f.name+"|"+f.size+"|"+f.lastModified;
        if(LIB.some(function(x){return x.k===key})){dup++;setTimeout(next,0);return}
        shrink(f,function(o){
          if(!o){bad++;setTimeout(next,0);return}
          var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
          idbPut(PK+id,o.src,function(ok){
            if(ok){LIB.push({id:id,k:key,th:o.th,sz:o.src.length});added++;if(added%20===0)persist()}else bad++;
            setTimeout(next,0);
          });
        });
      })();
    });
    /* --- 写真パック（iPadで作ったHTML）から取り込む --- */
    var packIn=document.getElementById("libPackFile");
    document.getElementById("libPack").onclick=function(){if(!importing)packIn.click()};
    function thumbOf(d,cb){
      var im=new Image();
      im.onload=function(){try{var r=Math.min(1,260/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.7))}catch(e){cb(null)}};
      im.onerror=function(){cb(null)};im.src=d;
    }
    packIn.addEventListener("change",function(){
      var files=[].slice.call(packIn.files||[]).sort(function(a,b){return a.name.localeCompare(b.name,"ja",{numeric:true})});packIn.value="";
      if(!files.length)return;
      importing=true;var fi=0,added=0,dup=0,bad=0,badFiles=0;
      function finish(){
        importing=false;
        prog.textContent="写真パックから取り込みました："+added+"枚"+(dup?"（同じ写真"+dup+"枚は取り込まず）":"")+(bad?"・読めなかった"+bad+"枚":"")+(badFiles?"・写真パックではないファイル"+badFiles+"個":"");
        persist();render();badge();
      }
      function nextFile(){
        if(fi>=files.length){finish();return}
        var f=files[fi++];prog.textContent="写真パックを読み込み中… （"+fi+" / "+files.length+"ファイル）";
        var rd=new FileReader();
        rd.onload=function(){
          var m=/<script type="application\/json" id="packData">([\s\S]*?)<\/script>/.exec(String(rd.result)),pk=null;
          try{pk=JSON.parse(m[1])}catch(e){}
          if(!pk||!pk.photos||!pk.photos.length){badFiles++;setTimeout(nextFile,0);return}
          var ps=pk.photos,pi=0;
          (function nextPhoto(){
            if(pi>=ps.length){setTimeout(nextFile,0);return}
            var p=ps[pi++],key="pack|"+(p.n||"")+"|"+(p.t||0)+"|"+String(p.d||"").length;
            prog.textContent="写真パックを読み込み中… "+fi+"/"+files.length+"ファイル目 "+pi+"/"+ps.length+"枚";
            if(LIB.some(function(x){return x.k===key})){dup++;setTimeout(nextPhoto,0);return}
            if(!p.d||String(p.d).indexOf("data:image/")!==0){bad++;setTimeout(nextPhoto,0);return}
            thumbOf(p.d,function(th){
              if(!th){bad++;setTimeout(nextPhoto,0);return}
              var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
              idbPut(PK+id,p.d,function(ok){
                if(ok){LIB.push({id:id,k:key,th:th,sz:p.d.length});added++;if(added%20===0)persist()}else bad++;
                setTimeout(nextPhoto,0);
              });
            });
          })();
        };
        rd.onerror=function(){badFiles++;setTimeout(nextFile,0)};
        rd.readAsText(f);
      }
      nextFile();
    });
    function drop(list){list.forEach(function(x){idbDel(PK+x.id)})}
    document.getElementById("libClear").onclick=function(){
      var u=usedIds(),gone=LIB.filter(function(x){return !u[x.id]});
      if(!gone.length){alert("未使用の写真はありません。");return}
      if(!confirm("未使用の写真 "+gone.length+"枚をライブラリから外します（使用済みの写真と、報告書の中の写真は消えません）。よろしいですか？"))return;
      LIB=LIB.filter(function(x){return u[x.id]});persist(function(){drop(gone)});render();badge();
    };

    /* --- 各写真欄の「📚 ライブラリ」ボタン --- */
    var oldCaps=setCaps;
    setCaps=function(){oldCaps();document.querySelectorAll(".photo").forEach(function(p){
      if(p.querySelector(".libb"))return;
      var b=document.createElement("button");b.type="button";b.className="libb no-print";b.textContent="📚 ライブラリ";p.appendChild(b);
    })};
    document.addEventListener("click",function(e){
      var t=e.target;if(!t.closest||!t.matches(".photo .libb"))return;
      e.preventDefault();e.stopPropagation();open("pick",t.closest(".photo"));
    },true);

    /* --- 「新しい報告書にする」：使った写真だけライブラリから外し、未使用はそのまま次へ --- */
    var nov=document.createElement("div");nov.id="newOv";nov.className="no-print";nov.hidden=true;
    nov.innerHTML='<div class="nbox"><div class="lhead"><b>写真ライブラリの整理</b></div><div class="lnote" id="newMsg"></div><div class="lact"><button type="button" id="newKeep" class="pk">未使用の写真は残す（次の報告書で使えます）</button><button type="button" id="newDrop" class="lsub">未使用の写真も外す</button></div></div>';
    document.body.appendChild(nov);
    var prev=window.ftBeforeNew;
    window.ftBeforeNew=function(go){
      (prev||function(g){g()})(function(){
        var u=usedIds(),usedList=LIB.filter(function(x){return u[x.id]}),unused=LIB.length-usedList.length;
        function fin(dropUnused){
          var gone=dropUnused?LIB.slice():usedList;
          LIB=dropUnused?[]:LIB.filter(function(x){return !u[x.id]});
          persist(function(){drop(gone);go()});
        }
        if(!unused){fin(false);return}
        document.getElementById("newMsg").textContent="未使用の写真が"+unused+"枚あります。次の報告書でも使うなら、残してください。";
        nov.hidden=false;
        document.getElementById("newKeep").onclick=function(){nov.hidden=true;fin(false)};
        document.getElementById("newDrop").onclick=function(){nov.hidden=true;fin(true)};
      });
    };

    /* --- 起動時の読み込み（前の形式＝写真本体を一覧に含んでいた保存は、1枚ずつの保存へ移す） --- */
    idbGet(LK,function(s){
      var a=[];try{a=JSON.parse(s||"[]")}catch(e){a=[]}
      var old=a.filter(function(x){return x.src});
      LIB=a.map(function(x){return {id:x.id,k:x.k,th:x.th,sz:x.sz||(x.src?x.src.length:0)}});badge();
      if(old.length){var n=0;old.forEach(function(x){idbPut(PK+x.id,x.src,function(){if(++n===old.length)persist()})})}
    });
    /* 大きな保存データを後から復元したときも、すぐ「残り◯枚」を合わせる */
    var oldApply=ibApplySnap;
    ibApplySnap=function(s){oldApply(s);badge()};
    setInterval(badge,3000);
    try{setCaps()}catch(e){}
  })();

  /* ====== 改行の修正：欄が横並び(flex)レイアウトでも、Enterで新しい行が「下」に増えるようにする ======
     以前はEnterで<div>ができ、2行目が右隣に並んで欄の高さも増えなかった。今は<br>で改行する。 */
  (function(){
    document.addEventListener("beforeinput",function(e){
      if(e.inputType==="insertParagraph"&&e.target&&e.target.isContentEditable){
        e.preventDefault();document.execCommand("insertLineBreak");
      }
    },true);
    /* 貼り付けの改行も同じ形に（既存の貼り付け処理より先に処理する） */
    document.addEventListener("paste",function(e){
      var t=e.target;if(!t||!t.isContentEditable)return;
      var s=(e.clipboardData||window.clipboardData).getData("text/plain");
      if(s.indexOf("\n")<0&&s.indexOf("\r")<0)return;
      e.preventDefault();e.stopImmediatePropagation();
      s.replace(/\r\n?/g,"\n").split("\n").forEach(function(ln,i){
        if(i)document.execCommand("insertLineBreak");
        if(ln)document.execCommand("insertText",false,ln);
      });
    },true);
    /* 以前の報告書に残っている「<div>で改行した欄」を、<br>の形に直す（開いたときに1回） */
    function fixLegacyDivs(){
      var n=0;
      document.querySelectorAll("[contenteditable]").forEach(function(el){
        if(el.closest("#libOv,#histOv,#newOv"))return;
        [].slice.call(el.children).forEach(function(d){
          if(d.tagName!=="DIV"||d.hasAttribute("contenteditable"))return;
          var hasPrev=!!d.previousSibling,onlyBr=d.childNodes.length===1&&d.firstChild.nodeName==="BR";
          var frag=document.createDocumentFragment();
          if(hasPrev)frag.appendChild(document.createElement("br"));
          if(!onlyBr)while(d.firstChild)frag.appendChild(d.firstChild);
          d.replaceWith(frag);n++;
        });
      });
      return n;
    }
    window.ftFixLegacyDivs=fixLegacyDivs;
    var oa=ibApplySnap;
    ibApplySnap=function(s){oa(s);if(fixLegacyDivs())later()};
    setTimeout(function(){if(fixLegacyDivs())later()},200);
  })();
})();
</script>
