/* ---- ツールバー（画面のみ） ---- */
.toolbar{position:sticky;top:0;z-index:20;background:#12206b;color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar b{margin-right:8px}
.toolbar button{font:inherit;font-size:13px;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;background:#2a45c2;color:#fff}
.toolbar button.sub{background:#4a5a9a}
.toolbar .note{font-size:12px;opacity:.85;margin-left:auto}
#saveState,#pageInfo{font-size:12px;opacity:.9}

/* ---- A4用紙 ---- */
#root{transform-origin:top center}
.sheet{position:relative;width:210mm;height:297mm;margin:14px auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.sheet.cover{padding:5.4mm 12mm 8mm 12.5mm}
.sheet.pg{padding:5mm 22mm 14mm}
.pbody{flex:1;min-height:0;position:relative;overflow:hidden}
.pno{position:absolute;left:0;right:0;bottom:6mm;text-align:center;font-size:12px;font-weight:700}
.pbody>.blk:first-child{margin-top:0}
.blk{margin-top:3mm}

[contenteditable]{outline:none;white-space:pre-wrap;word-break:break-all}
[contenteditable]:hover{background:#fffbe0}
[contenteditable]:focus{background:#fff6b8}
@media screen{[contenteditable]:empty::before{content:attr(data-ph);color:#b0b0b0}}

/* ---- 上部の型式表 ---- */
table.code{width:100%;border-collapse:collapse;font-size:10.5px;table-layout:fixed}
table.code td{border:2px solid var(--line);padding:1px 4px;height:4.6mm;text-align:center;white-space:nowrap}
table.code td.l{text-align:left}
.pg-head .logo{height:9mm;width:40mm;margin:4mm 0 1.5mm}

/* ---- 表紙 ---- */
.ctitle{font-size:22px;font-weight:700;text-align:center;margin:3.6mm 0 3mm;letter-spacing:.04em}
.ctitle span{display:inline-block;min-width:3em}
.cmain{display:flex;gap:4.5mm;margin-top:3.2mm;align-items:flex-start}
.cmain .photo{flex:0 0 63%;aspect-ratio:1.34}
table.dates{flex:1;border-collapse:collapse;font-size:13px}
table.dates td{border:2px solid var(--line);height:8mm;padding:0 6px;text-align:center;white-space:nowrap}
table.dates td.k{background:#8f8f8f;color:#111;letter-spacing:.5em;width:50%;font-weight:700}
.gtitle{background:var(--gray);text-align:center;font-weight:800;font-size:21px;letter-spacing:.6em;padding:.6mm 0 .6mm .6em;margin-top:3mm}
.sg{display:grid;grid-template-columns:9.5mm 6.2mm 34mm 1fr;border:2px solid var(--line);margin-top:1.5mm;font-size:13px}
.sg>div{border-bottom:1px solid var(--line);padding:0 5px;display:flex;align-items:center;min-height:5.8mm}
.sg .g1{grid-column:1;grid-row:1/15;background:var(--gray);border-right:2px solid var(--line);border-bottom:0;justify-content:center;padding:0}
.sg .g2{grid-column:2;background:#fff;border-right:1px solid var(--line);justify-content:center;padding:0;font-weight:700}
.sg .lab{grid-column:3;justify-content:center;font-weight:800;font-size:14px;border-right:1px solid var(--line)}
.sg .val{grid-column:4}
.sg .cut{border-bottom:2px solid var(--line)}
.sg .last{border-bottom:0}
.sg .g2.cut{border-bottom:2px solid var(--line)}
.sg .g2.last{border-bottom:0}
.vt{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:13.5px;line-height:1.28}
.vt.s{font-size:12.5px}
.other{display:grid;grid-template-columns:9.5mm 1fr;border:2px solid var(--line);border-top:0;min-height:35mm;font-size:13.5px}
.other .g1{background:var(--gray);border-right:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.other .body{display:flex;align-items:center;padding:2px 3px;line-height:1.45}
.other .body>div{width:100%}
.cfoot{text-align:center;font-size:12.5px;margin-top:4mm;line-height:1.4}
.cfoot span.nm{display:inline-block;min-width:11em;text-align:center}
.cfoot2{display:flex;align-items:center;gap:2mm;margin-top:3mm;line-height:1.25}
.cfoot2 .t{white-space:nowrap}
.cfoot2 .t b{display:block;font-weight:500;font-size:12.5px}
.cfoot2 .t i{font-style:normal;font-size:10.5px}
.cfoot2 .qr{width:13mm;height:13mm;flex:none}
.cfoot2 .logo{width:40mm;height:10mm;flex:none;margin-left:auto}

/* ---- 写真 ---- */
.photo{position:relative;background:#f1f3f9;border:1px solid #8a93b5;overflow:hidden;display:block}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:#5b6690;cursor:pointer;padding:6px}
.photo .cam{display:none;position:absolute;left:6px;bottom:6px;z-index:3;border:0;border-radius:8px;background:#2a45c2;color:#fff;font:inherit;font-size:15px;min-height:40px;padding:6px 14px;cursor:pointer}
@media screen and (pointer:coarse){.photo .cam{display:block}}
.photo input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo.has .ph{display:none}
.photo .rm{position:absolute;right:4px;top:4px;z-index:2;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;display:none;line-height:22px;padding:0}
.photo.has .rm{display:block}
.photo.has{cursor:pointer}
.photo.drag{outline:3px dashed #2a45c2}

/* ---- 2ページ目以降 ---- */
.zenkei{display:flex;gap:4mm}
.zl{flex:0 0 55%}
.zl .photo{aspect-ratio:1.34}
.zr{flex:1;display:flex;flex-direction:column;min-width:0}
.gband{background:var(--slate);color:#fff;text-align:center;font-weight:700;font-size:15px;border:3px solid #c3c3c3;padding:.4mm 0;margin-bottom:0;line-height:1.5}
.zl .gband{margin-bottom:0}
.env{display:grid;grid-template-columns:36% 1fr;border:2px solid var(--line);font-size:11.5px}
.env>div{border-top:2px solid var(--line);padding:1px 4px;min-height:8.8mm;display:flex;align-items:center}
.env .t{grid-column:1/3;border-top:0;justify-content:center;min-height:10.6mm;font-size:13px}
.env .k{justify-content:center;border-right:2px solid var(--line);font-size:12.5px}
.zr .gband.s{width:58%;margin-top:2.4mm}
.zr .photo{width:58%;aspect-ratio:1.48}
.band{position:relative;background:var(--navy);color:#fff;text-align:center;font-weight:700;font-size:14.5px;padding:2.2mm 0;line-height:1.4}
.band>div[contenteditable]{min-height:1.4em;padding:0 22%}
.band>div[contenteditable]:hover,.band>div[contenteditable]:focus{color:#111}
.band .sec-tools{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;gap:4px}
.entry{display:flex;gap:4mm;position:relative}
.entry .photo{flex:0 0 55%;aspect-ratio:1.34;align-self:flex-start}
.dg{flex:1;position:relative;min-width:0}
.dg>.in{position:absolute;inset:0;display:grid;grid-template-columns:28% 1fr;grid-template-rows:minmax(0,13fr) minmax(0,36fr) minmax(0,51fr);border:2px solid var(--line);font-size:12px}
.dg .in>div{padding:1px 4px;overflow:hidden;border-bottom:2px solid var(--line)}
.dg .in>div:nth-child(n+5){border-bottom:0}
.dg .k{display:flex;align-items:center;justify-content:center;text-align:center;border-right:2px solid var(--line);font-size:12.5px}
.dg .v{padding-top:0;line-height:1.38;letter-spacing:.04em}
.dg .v.c{display:flex;align-items:center;justify-content:center;text-align:center}
.entry .sec-tools{position:absolute;left:4px;top:4px;z-index:3}
.mini{font:inherit;font-size:12px;border:1px solid #9aa4bb;background:#fff;color:#223;border-radius:5px;padding:2px 8px;cursor:pointer}
.mini.del{border-color:#d49a9a;color:#a33}

/* ---- 定型文プルダウン（画面のみ） ---- */
#tmplBtn{position:fixed;z-index:30;display:none;border:1px solid #2a45c2;background:#fff;color:#2a45c2;border-radius:6px;font:inherit;font-size:12px;line-height:1;padding:5px 8px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#tmplMenu{position:fixed;z-index:31;display:none;background:#fff;border:1px solid #2a45c2;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.35);max-height:70vh;overflow:auto;width:min(92vw,440px)}
#tmplMenu .ttl{padding:6px 12px;font-size:12px;background:#eef1fb;color:#2a45c2;font-weight:700}
#tmplMenu button{display:block;width:100%;text-align:left;border:0;border-top:1px solid #e1e5f3;background:#fff;font:inherit;font-size:14px;line-height:1.45;padding:10px 12px;cursor:pointer}
#tmplMenu button:hover{background:#fff6b8}
#tmplMenu button.clr{color:#a33}
@media screen and (pointer:coarse){#tmplBtn{font-size:15px;padding:9px 12px}#tmplMenu button{font-size:16px;padding:13px 14px}}
@media print{#tmplBtn,#tmplMenu{display:none !important}}
.cap #tmplBtn,.cap #tmplMenu{display:none !important}

/* ---- iPad・タブレット対応 ---- */
@media screen and (pointer:coarse){
  .toolbar button{min-height:42px;font-size:15px;padding:8px 14px}
  .mini{min-height:34px;font-size:14px;padding:4px 12px}
  .photo .rm{width:34px;height:34px;line-height:34px;font-size:18px}
  [contenteditable]:hover{background:none}
  .toolbar .note{display:none}
}
.photo,.photo .ph{-webkit-touch-callout:none}

/* PDF作成時の見た目（編集用の部品を隠す） */
.cap .no-print,.cap .sec-tools,.cap .photo .rm,.cap .photo .ph,.cap .photo .cam{display:none !important}
.cap .sheet{margin:0 !important;box-shadow:none !important}
.cap [contenteditable]:hover,.cap [contenteditable]:focus{background:none !important}
.cap [contenteditable]:empty::before{content:none !important}
.cap .photo{border-color:#666}
.cap .photo:not(.has){background:#fff}
#pdfBusy{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}

/* ---- 印刷：画面と同じA4を1枚ずつ ---- */
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  .toolbar,.no-print,.sec-tools,.photo .rm{display:none !important}
  #root{zoom:1 !important}
  html.ios #root{zoom:.82 !important}
  html.ios .sheet{margin:0 auto}
  .sheet{margin:0;box-shadow:none;height:296.5mm;break-after:page;break-inside:avoid}
  .sheet:last-child{break-after:auto}
  [contenteditable]:hover,[contenteditable]:focus{background:none}
  .photo{border-color:#666}
  .photo .ph{display:none}
  .photo:not(.has){background:#fff}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

  function loadPhoto(label,file){

        var max=1300,r=Math.min(1,max/Math.max(im.width,im.height));

        label.classList.add("has");save();
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(file);
  }

  function buildPdf(){

    var rootEl=document.documentElement,prevZoom=root.style.zoom;
    var busy=document.createElement("div");busy.id="pdfBusy";busy.textContent="PDFを作成しています…";document.body.appendChild(busy);
    rootEl.classList.add("cap");root.style.zoom="";
    var pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
    var sheets=[].slice.call(root.querySelectorAll(".sheet"));
    /* html2canvasはobject-fitに非対応のため、写真は背景画像（cover）に置き換えて撮る */
    var swapped=[];
    root.querySelectorAll(".photo.has").forEach(function(p){
      var im=p.querySelector("img");if(!im||!im.getAttribute("src"))return;
      swapped.push([p,im,p.style.cssText]);
      p.style.background="#fff url("+im.getAttribute("src")+") center/cover no-repeat";
      im.style.visibility="hidden";
    });
    var chain=Promise.resolve();
    sheets.forEach(function(sh,i){
      chain=chain.then(function(){
        return window.html2canvas(sh,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false}).then(function(c){
          if(i>0)pdf.addPage("a4","portrait");
          pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297,undefined,"FAST");
        });
      });
    });
    return chain.then(function(){return pdf}).finally(function(){
      swapped.forEach(function(x){x[0].style.cssText=x[2];x[1].style.visibility=""});
      rootEl.classList.remove("cap");root.style.zoom=prevZoom;fit();busy.remove();
    });
  }

      var blob=pdf.output("blob"),name="定期診断ご報告書_"+owner()+".pdf";
      var file=new File([blob],name,{type:"application/pdf"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:name}).catch(function(){pdf.save(name)});
      }else{pdf.save(name)}
    }).catch(function(){});
  });
  document.getElementById("btnSave").addEventListener("click",function(){
    paginate();save();
    var r=document.documentElement;r.setAttribute("data-baked","1");
    var html="<!DOCTYPE html>\n"+r.outerHTML;
    r.removeAttribute("data-baked");
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
    a.download="定期診断ご報告書_"+owner()+".html";document.body.appendChild(a);a.click();a.remove();
  });
})();
</script>
</body>
</html>
